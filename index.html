<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nômade">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Nômade — Checklist</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --teal:#3d7d8a;
      --teal-light:#e8f4f6;
      --teal-mid:#b8dde3;
      --dark:#1a2e32;
      --text:#1a2e32;
      --muted:#7a9ea5;
      --border:#d4e8eb;
      --bg:#f5f9fa;
      --white:#ffffff;
      --green:#2a9d6f;
      --green-bg:#e8f7f1;
      --red:#c94040;
      --red-bg:#fdf0f0;
      --radius:14px;
      --radius-sm:10px;
      --shadow:0 2px 12px rgba(61,125,138,0.10);
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
    .screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
    .screen.hidden{display:none}

    /* HEADER */
    .app-header{
      background:var(--white);
      padding:max(env(safe-area-inset-top),14px) 20px 14px;
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:12px;
      flex-shrink:0;
      box-shadow:0 1px 8px rgba(61,125,138,0.07);
    }
    .app-header img{height:32px;object-fit:contain}
    .back-btn{
      display:flex;align-items:center;gap:4px;
      background:none;border:none;color:var(--teal);
      font-size:15px;font-weight:500;cursor:pointer;
      font-family:inherit;padding:0;
    }
    .back-btn svg{width:18px;height:18px}
    .header-sub{font-size:13px;color:var(--muted);margin-left:auto;font-weight:500}

    /* SCROLL */
    .scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px 100px}

    /* HOME */
    .new-btn{
      width:100%;padding:16px;
      background:var(--teal);border:none;
      border-radius:var(--radius);
      font-size:16px;font-weight:600;color:white;
      cursor:pointer;display:flex;align-items:center;
      justify-content:center;gap:8px;margin-bottom:24px;
      box-shadow:0 4px 16px rgba(61,125,138,0.25);
    }
    .new-btn svg{width:20px;height:20px}

    .section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}

    /* HISTORY GRID */
    .history-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .cl-card{
      background:var(--white);border:1px solid var(--border);
      border-radius:var(--radius);padding:14px;
      cursor:pointer;transition:transform 0.1s,box-shadow 0.1s;
      box-shadow:var(--shadow);
    }
    .cl-card:active{transform:scale(0.97)}
    .cl-card-icon{
      width:36px;height:36px;background:var(--teal-light);
      border-radius:10px;display:flex;align-items:center;
      justify-content:center;margin-bottom:10px;font-size:18px;
    }
    .cl-card-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cl-card-apto{font-size:12px;color:var(--muted);margin-bottom:10px}
    .mini-bar{height:4px;background:var(--teal-light);border-radius:2px;overflow:hidden;margin-bottom:4px}
    .mini-bar-fill{height:4px;background:var(--teal);border-radius:2px;transition:width 0.3s}
    .mini-pct{font-size:11px;color:var(--muted);font-weight:600}
    .cl-card-del{
      margin-top:10px;padding:5px 0;width:100%;
      background:none;border:none;color:var(--red);
      font-size:12px;cursor:pointer;text-align:left;
      font-family:inherit;
    }

    .empty-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

    /* FORM */
    .form-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
    .form-card-title{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:14px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .form-group{display:flex;flex-direction:column;gap:5px}
    .form-group.full{grid-column:span 2}
    .form-group label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .form-group input{
      padding:11px 12px;
      background:var(--bg);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);font-size:14px;
      color:var(--text);font-family:inherit;
    }
    .form-group input:focus{outline:none;border-color:var(--teal);background:white}
    .form-submit{
      width:100%;padding:15px;background:var(--teal);
      border:none;border-radius:var(--radius);
      font-size:16px;font-weight:700;color:white;
      cursor:pointer;box-shadow:0 4px 16px rgba(61,125,138,0.25);
    }

    /* CHECKLIST */
    .progress-card{
      background:var(--white);border:1px solid var(--border);
      border-radius:var(--radius);padding:14px 16px;
      margin-bottom:16px;box-shadow:var(--shadow);
    }
    .progress-top{display:flex;justify-content:space-between;margin-bottom:8px}
    .progress-top span{font-size:13px;color:var(--muted);font-weight:500}
    .progress-top span:last-child{color:var(--teal);font-weight:700}
    .prog-bar-bg{height:7px;background:var(--teal-light);border-radius:4px;overflow:hidden}
    .prog-bar-fill{height:7px;background:var(--teal);border-radius:4px;transition:width 0.3s}

    .cl-section{margin-bottom:16px}
    .cl-section-title{
      display:flex;align-items:center;gap:7px;
      font-size:11px;font-weight:700;color:var(--teal);
      text-transform:uppercase;letter-spacing:0.8px;
      padding:8px 0 8px;border-bottom:2px solid var(--teal-light);
      margin-bottom:6px;
    }

    /* ITEMS GRID */
    .items-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:4px}
    .cl-item{
      background:var(--white);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);padding:10px;
      transition:border-color 0.15s;
    }
    .cl-item.done-sim{border-color:var(--green);background:var(--green-bg)}
    .cl-item.done-nao{border-color:var(--red);background:var(--red-bg)}

    .cl-item-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:4px}
    .cl-item-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;flex:1}
    .forn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
    .forn-dot.prop{background:var(--teal-mid)}
    .forn-dot.nom{background:var(--green)}

    .toggle-row{display:flex;gap:5px;margin-bottom:7px}
    .toggle-sim,.toggle-nao{
      flex:1;padding:5px 4px;border-radius:6px;
      border:1.5px solid var(--border);font-size:11px;
      font-weight:700;cursor:pointer;background:var(--bg);
      color:var(--muted);font-family:inherit;transition:all 0.1s;
    }
    .toggle-sim.active{background:var(--green-bg);border-color:var(--green);color:var(--green)}
    .toggle-nao.active{background:var(--red-bg);border-color:var(--red);color:var(--red)}

    .cl-input{
      width:100%;padding:5px 8px;
      background:rgba(255,255,255,0.7);
      border:1px solid var(--border);border-radius:6px;
      font-size:11px;color:var(--text);font-family:inherit;
      margin-bottom:4px;
    }
    .cl-input:last-child{margin-bottom:0}
    .cl-input:focus{outline:none;border-color:var(--teal)}
    .cl-input::placeholder{color:var(--muted)}

    /* BOTTOM */
    .bottom-bar{
      position:absolute;bottom:0;left:0;right:0;
      padding:12px 16px;
      padding-bottom:max(env(safe-area-inset-bottom),12px);
      background:rgba(245,249,250,0.95);
      backdrop-filter:blur(10px);
      border-top:1px solid var(--border);
    }
    .whatsapp-btn{
      width:100%;padding:15px;background:#25D366;
      border:none;border-radius:var(--radius);
      font-size:16px;font-weight:700;color:white;
      cursor:pointer;display:flex;align-items:center;
      justify-content:center;gap:10px;
      box-shadow:0 4px 16px rgba(37,211,102,0.3);
    }
    .whatsapp-btn svg{width:22px;height:22px}

    input[type="date"]::-webkit-calendar-picker-indicator{opacity:0.5}
  </style>
</head>
<body>

<!-- HOME -->
<div class="screen" id="screen-home">
  <div class="app-header">
    <img src="logo.png" alt="Nômade Stays">
  </div>
  <div class="scroll-body">
    <button class="new-btn" onclick="goToForm()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Novo Checklist
    </button>
    <div class="section-label">Checklists salvos</div>
    <div id="history-list"></div>
  </div>
</div>

<!-- FORM -->
<div class="screen hidden" id="screen-form">
  <div class="app-header">
    <button class="back-btn" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar
    </button>
    <span class="header-sub">Novo Checklist</span>
  </div>
  <div class="scroll-body">
    <div class="form-card">
      <div class="form-card-title">🏠 Imóvel</div>
      <div class="form-grid">
        <div class="form-group"><label>Condomínio</label><input id="f-cond" placeholder="Nome" autocomplete="off"></div>
        <div class="form-group"><label>Apto</label><input id="f-apto" placeholder="Número" autocomplete="off"></div>
        <div class="form-group"><label>Hóspedes</label><input id="f-hosp" type="number" placeholder="0"></div>
        <div class="form-group"><label>Data</label><input id="f-data" type="date"></div>
      </div>
    </div>
    <div class="form-card">
      <div class="form-card-title">🔑 Acesso</div>
      <div class="form-grid">
        <div class="form-group"><label>Senha da Porta</label><input id="f-porta" placeholder="Código" autocomplete="off"></div>
        <div class="form-group"><label>Wi-Fi</label><input id="f-wifi" placeholder="Rede / senha" autocomplete="off"></div>
      </div>
    </div>
    <button class="form-submit" onclick="createChecklist()">Criar Checklist →</button>
  </div>
</div>

<!-- CHECKLIST -->
<div class="screen hidden" id="screen-checklist">
  <div class="app-header">
    <button class="back-btn" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar
    </button>
    <span class="header-sub" id="cl-subtitle"></span>
  </div>
  <div class="scroll-body" id="cl-body"></div>
  <div class="bottom-bar">
    <button class="whatsapp-btn" onclick="sendWhatsApp()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.528 5.855L.057 23.804a.5.5 0 0 0 .609.61l6.012-1.457A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a9.946 9.946 0 0 1-5.073-1.378l-.361-.214-3.754.91.946-3.668-.235-.374A9.946 9.946 0 0 1 2 12c0-5.514 4.486-10 10-10s10 4.486 10 10-4.486 10-10 10z"/></svg>
      Enviar por WhatsApp
    </button>
  </div>
</div>

<script>
const SECTIONS={
  "INFRAESTRUTURA":{icon:"🏢",items:[["Fechadura Eletrônica","P"],["Internet/Wi-Fi","P"],["Ar Condicionado","P"]]},
  "COZINHA":{icon:"🍳",items:[["Fogão","P"],["Microondas","P"],["Filtro de Água","P"],["AirFryer","P"],["Cafeteira Nespresso","P"],["Cafeteira Convencional","P"],["Sanduicheira","P"],["Escorredor de Louças","P"],["Pratos Rasos","P"],["Pratos Fundos","P"],["Colheres Sopa","P"],["Colheres Sobremesa","P"],["Garfos","P"],["Facas","P"],["Facas Grandes","P"],["Jogo de Pegadores","P"],["Abridor de Vinho","P"],["Escorredor Macarrão","P"],["Tábua de Corte","P"],["Xícaras c/ Pires","P"],["Taças de Vinho","P"],["Taças Champagne","P"],["Copos","P"],["Leiteira","P"],["Panelas","P"],["Frigideiras","P"],["Lixeira","P"],["Dispenser Esponja","P"],["Mesa de Jantar","P"],["Cadeiras","P"]]},
  "SALA":{icon:"🛋️",items:[["Sofá","P"],["Sofá Cama","P"],["Almofadas","P"],["TV","P"],["Cortina Blackout","P"]]},
  "QUARTO":{icon:"🛏️",items:[["Cama","P"],["Guarda-Roupa","P"],["TV","P"],["Cabides","P"],["Espelho Grande","P"],["Cortina Blackout","P"],["Almofadas","P"],["Travesseiros","P"]]},
  "BANHEIRO":{icon:"🚿",items:[["Lixeira","P"],["Dispenser Sabonete","P"],["Porta Escovas","P"],["Secador de Cabelo","P"],["Espelho","P"]]},
  "LIMPEZA":{icon:"🧹",items:[["Aspirador de Pó","P"],["Vassoura","P"],["Rodo","P"],["Balde","P"],["Pá de Lixo","P"]]},
  "COMODIDADES":{icon:"👔",items:[["Tábua de Passar","P"],["Ferro de Passar","P"]]},
  "ENXOVAL":{icon:"🛁",items:[["Capa Prot. Travesseiro","P"],["Capa Prot. Colchão","P"],["Edredom","P"],["Cobertor","P"],["Toalhas de Banho","N"],["Toalhas de Rosto","N"],["Tapete Banheiro","N"],["Toalha Make Up","N"],["Fronhas","N"],["Lençol Elástico","N"],["Lençol Cobrir","N"],["Capa Edredom","N"],["Tapete Entrada","N"]]}
};

let DB=JSON.parse(localStorage.getItem('nomade_v2')||'[]');
let currentId=null;
function save(){localStorage.setItem('nomade_v2',JSON.stringify(DB))}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function goHome(){showScreen('screen-home');renderHistory()}
function goToForm(){
  document.getElementById('f-data').value=new Date().toISOString().split('T')[0];
  showScreen('screen-form');
}

function createChecklist(){
  const cond=document.getElementById('f-cond').value.trim();
  const apto=document.getElementById('f-apto').value.trim();
  if(!cond||!apto){alert('Preencha condomínio e apto');return}
  const items={};
  Object.entries(SECTIONS).forEach(([sec,{items:its}])=>{
    its.forEach(([nome,forn],i)=>{items[`${sec}_${i}`]={nome,forn,sim:null,qnt:'',obs:''}});
  });
  const cl={id:Date.now().toString(),cond,apto,
    hosp:document.getElementById('f-hosp').value||'',
    data:document.getElementById('f-data').value||'',
    porta:document.getElementById('f-porta').value||'',
    wifi:document.getElementById('f-wifi').value||'',
    items,createdAt:new Date().toISOString()};
  DB.unshift(cl);save();openChecklist(cl.id);
}

function openChecklist(id){
  currentId=id;
  const cl=DB.find(c=>c.id===id);if(!cl)return;
  const dataFmt=cl.data?new Date(cl.data+'T12:00:00').toLocaleDateString('pt-BR'):'';
  document.getElementById('cl-subtitle').textContent=cl.cond+' · Apto '+cl.apto+(dataFmt?' · '+dataFmt:'');
  renderChecklist(cl);showScreen('screen-checklist');
}

function renderChecklist(cl){
  const body=document.getElementById('cl-body');
  const total=Object.keys(cl.items).length;
  const checked=Object.values(cl.items).filter(i=>i.sim!==null).length;
  const pct=total?Math.round(checked/total*100):0;
  let html=`<div class="progress-card">
    <div class="progress-top"><span>${checked} de ${total} itens</span><span>${pct}%</span></div>
    <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
  </div>`;
  Object.entries(SECTIONS).forEach(([sec,{icon,items:its}])=>{
    html+=`<div class="cl-section"><div class="cl-section-title">${icon} ${sec}</div><div class="items-grid">`;
    its.forEach(([nome,forn],i)=>{
      const key=`${sec}_${i}`;
      const item=cl.items[key];
      const ds=item.sim===true?'done-sim':item.sim===false?'done-nao':'';
      const fc=forn==='N'?'nom':'prop';
      html+=`<div class="cl-item ${ds}" id="card_${key}">
        <div class="cl-item-top">
          <span class="cl-item-name">${nome}</span>
          <span class="forn-dot ${fc}" title="${forn==='N'?'Nômade':'Proprietário'}"></span>
        </div>
        <div class="toggle-row">
          <button class="toggle-sim ${item.sim===true?'active':''}" onclick="toggle('${key}',true)">✓ Sim</button>
          <button class="toggle-nao ${item.sim===false?'active':''}" onclick="toggle('${key}',false)">✗ Não</button>
        </div>
        <input class="cl-input" placeholder="qtd / tipo" value="${item.qnt}" oninput="updateField('${key}','qnt',this.value)">
        <input class="cl-input" placeholder="observação" value="${item.obs}" oninput="updateField('${key}','obs',this.value)">
      </div>`;
    });
    html+=`</div></div>`;
  });
  body.innerHTML=html;
}

function toggle(key,val){
  const cl=DB.find(c=>c.id===currentId);if(!cl)return;
  cl.items[key].sim=cl.items[key].sim===val?null:val;save();
  const card=document.getElementById('card_'+key);
  const sv=cl.items[key].sim;
  card.className='cl-item'+(sv===true?' done-sim':sv===false?' done-nao':'');
  card.querySelectorAll('.toggle-sim').forEach(b=>b.classList.toggle('active',sv===true));
  card.querySelectorAll('.toggle-nao').forEach(b=>b.classList.toggle('active',sv===false));
  const total=Object.keys(cl.items).length;
  const checked=Object.values(cl.items).filter(i=>i.sim!==null).length;
  const pct=Math.round(checked/total*100);
  document.querySelector('.prog-bar-fill').style.width=pct+'%';
  document.querySelector('.progress-top span').textContent=`${checked} de ${total} itens`;
  document.querySelector('.progress-top span:last-child').textContent=pct+'%';
}

function updateField(key,field,value){
  const cl=DB.find(c=>c.id===currentId);if(!cl)return;
  cl.items[key][field]=value;save();
}

function renderHistory(){
  const el=document.getElementById('history-list');
  if(!DB.length){el.innerHTML='<div class="empty-state">Nenhum checklist ainda.<br>Crie o primeiro! 🏠</div>';return}
  el.innerHTML='<div class="history-grid">'+DB.map(cl=>{
    const total=Object.keys(cl.items).length;
    const checked=Object.values(cl.items).filter(i=>i.sim!==null).length;
    const pct=Math.round(checked/total*100);
    const dataFmt=cl.data?new Date(cl.data+'T12:00:00').toLocaleDateString('pt-BR'):'';
    return `<div class="cl-card" onclick="openChecklist('${cl.id}')">
      <div class="cl-card-icon">🏠</div>
      <div class="cl-card-name">${cl.cond}</div>
      <div class="cl-card-apto">Apto ${cl.apto}${dataFmt?' · '+dataFmt:''}</div>
      <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
      <div class="mini-pct">${pct}% concluído</div>
      <button class="cl-card-del" onclick="delCl(event,'${cl.id}')">🗑 Excluir</button>
    </div>`;
  }).join('')+'</div>';
}

function delCl(e,id){
  e.stopPropagation();
  if(!confirm('Excluir este checklist?'))return;
  DB=DB.filter(c=>c.id!==id);save();renderHistory();
}

function sendWhatsApp(){
  const cl=DB.find(c=>c.id===currentId);if(!cl)return;
  const dataFmt=cl.data?new Date(cl.data+'T12:00:00').toLocaleDateString('pt-BR'):'—';
  let msg=`*✅ CHECK-LIST IMPLANTAÇÃO — NÔMADE STAYS*\n\n`;
  msg+=`📍 *Condomínio:* ${cl.cond}\n🏠 *Apto:* ${cl.apto}${cl.hosp?' · '+cl.hosp+' hóspedes':''}\n`;
  msg+=`📅 *Data:* ${dataFmt}\n🔑 *Senha porta:* ${cl.porta||'—'}\n📶 *Wi-Fi:* ${cl.wifi||'—'}\n\n`;
  Object.entries(SECTIONS).forEach(([sec,{items:its}])=>{
    msg+=`*${sec}*\n`;
    its.forEach(([nome],i)=>{
      const item=cl.items[`${sec}_${i}`];
      const s=item.sim===true?'✅':item.sim===false?'❌':'⬜';
      let line=`${s} ${nome}`;
      if(item.qnt)line+=` — ${item.qnt}`;
      if(item.obs)line+=` _(${item.obs})_`;
      msg+=line+'\n';
    });
    msg+='\n';
  });
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

renderHistory();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
