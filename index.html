<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nômade">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Nômade — Checklist</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --gold: #c9a96e;
      --dark: #1a1a1a;
      --dark2: #252525;
      --dark3: #2e2e2e;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: #888;
      --green: #2ecc71;
      --green-bg: rgba(46,204,113,0.12);
      --red: #e74c3c;
      --red-bg: rgba(231,76,60,0.12);
      --radius: 12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* ── SCREENS ── */
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
    .screen.hidden { display: none; }

    /* ── HEADER ── */
    .app-header {
      background: var(--dark);
      padding: env(safe-area-inset-top, 12px) 20px 14px;
      padding-top: max(env(safe-area-inset-top), 12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 17px; font-weight: 600; color: var(--text); }
    .header-text p { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1px; }
    .header-action { margin-left: auto; }
    .btn-icon {
      width: 36px; height: 36px;
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text);
    }
    .btn-icon svg { width: 18px; height: 18px; }

    /* ── SCROLLABLE BODY ── */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 100px;
    }

    /* ── HOME SCREEN ── */
    .new-btn {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      color: var(--dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .new-btn svg { width: 20px; height: 20px; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .checklist-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      active-transform: scale(0.98);
    }
    .checklist-card:active { transform: scale(0.98); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .card-name { font-size: 15px; font-weight: 500; }
    .card-date { font-size: 12px; color: var(--muted); }
    .card-sub { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .card-progress { display: flex; align-items: center; gap: 10px; }
    .mini-bar { flex: 1; height: 4px; background: var(--dark3); border-radius: 2px; overflow: hidden; }
    .mini-bar-fill { height: 4px; background: var(--gold); border-radius: 2px; }
    .mini-pct { font-size: 12px; color: var(--muted); min-width: 32px; text-align: right; }

    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state svg { width: 48px; height: 48px; color: var(--dark3); margin-bottom: 12px; }
    .empty-state p { color: var(--muted); font-size: 14px; }

    /* ── FORM SCREEN ── */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
      appearance: none;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--gold);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .form-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      color: var(--dark);
      cursor: pointer;
      margin-top: 8px;
    }

    /* ── CHECKLIST SCREEN ── */
    .progress-block {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .progress-nums { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .progress-nums span:last-child { color: var(--gold); font-weight: 600; }
    .prog-bar-bg { height: 6px; background: var(--dark3); border-radius: 3px; overflow: hidden; }
    .prog-bar-fill { height: 6px; background: var(--gold); border-radius: 3px; transition: width 0.3s; }

    .cl-section { margin-bottom: 20px; }
    .cl-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 0 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .cl-section-title svg { width: 14px; height: 14px; }

    .cl-item {
      padding: 12px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .cl-item-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .status-dot {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: var(--dark3);
    }
    .status-dot.sim { background: var(--green-bg); border-color: var(--green); }
    .status-dot.nao { background: var(--red-bg); border-color: var(--red); }
    .status-dot svg { width: 12px; height: 12px; display: none; }
    .status-dot.sim svg.check { display: block; color: var(--green); }
    .status-dot.nao svg.cross { display: block; color: var(--red); }

    .cl-item-name { font-size: 14px; font-weight: 500; flex: 1; }
    .forn-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .forn-prop { background: rgba(201,169,110,0.15); color: var(--gold); }
    .forn-nom { background: rgba(46,204,113,0.15); color: var(--green); }

    .cl-item-controls {
      display: grid;
      grid-template-columns: auto auto 1fr 1fr;
      gap: 6px;
      align-items: center;
      padding-left: 32px;
    }
    .toggle-sim, .toggle-nao {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: var(--dark3);
      color: var(--muted);
    }
    .toggle-sim.active { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .toggle-nao.active { background: var(--red-bg); border-color: var(--red); color: var(--red); }
    .cl-input {
      padding: 5px 10px;
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text);
      font-family: inherit;
      width: 100%;
    }
    .cl-input:focus { outline: none; border-color: rgba(201,169,110,0.5); }
    .cl-input::placeholder { color: var(--muted); }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 12px 16px;
      padding-bottom: max(env(safe-area-inset-bottom), 12px);
      background: var(--dark);
      border-top: 1px solid var(--border);
    }
    .whatsapp-btn {
      width: 100%;
      padding: 15px;
      background: #25D366;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .whatsapp-btn svg { width: 22px; height: 22px; }

    /* ── BACK BTN ── */
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none;
      color: var(--gold); font-size: 15px;
      cursor: pointer; padding: 0;
      font-family: inherit;
    }
    .back-btn svg { width: 18px; height: 18px; }

    /* DELETE */
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .card-del-btn {
      padding: 6px 12px;
      background: none;
      border: 1px solid rgba(231,76,60,0.3);
      border-radius: 6px;
      color: var(--red);
      font-size: 12px;
      cursor: pointer;
    }

    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
  </style>
</head>

  <div class="bottom-bar">
    <button class="whatsapp-btn" onclick="sendWhatsApp()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.528 5.855L.057 23.804a.5.5 0 0 0 .609.61l6.012-1.457A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a9.946 9.946 0 0 1-5.073-1.378l-.361-.214-3.754.91.946-3.668-.235-.374A9.946 9.946 0 0 1 2 12c0-5.514 4.486-10 10-10s10 4.486 10 10-4.486 10-10 10z"/></svg>
      Enviar por WhatsApp
    </button>
  </div>
</div>

<script>
const SECTIONS = {
  "INFRAESTRUTURA": { icon: "🏢", items: [["Fechadura Eletrônica","Proprietario"],["Internet/Wi-Fi","Proprietario"],["Ar Condicionado","Proprietario"]] },
  "COZINHA": { icon: "🍳", items: [["Fogão","Proprietario"],["Microondas","Proprietario"],["Filtro de Água","Proprietario"],["AirFryer","Proprietario"],["Cafeteira Nespresso","Proprietario"],["Cafeteira Convencional","Proprietario"],["Sanduicheira","Proprietario"],["Escorredor de Louças","Proprietario"],["Pratos Rasos","Proprietario"],["Pratos Fundos","Proprietario"],["Colheres Sopa","Proprietario"],["Colheres Sobremesa","Proprietario"],["Garfos","Proprietario"],["Facas","Proprietario"],["Facas Grandes","Proprietario"],["Jogo de Pegadores","Proprietario"],["Abridor de Vinho","Proprietario"],["Escorredor de Macarrão","Proprietario"],["Tábua de Corte","Proprietario"],["Xícaras Café c/ Pires","Proprietario"],["Taças de Vinho","Proprietario"],["Taças de Champagne","Proprietario"],["Copos","Proprietario"],["Leiteira","Proprietario"],["Panelas","Proprietario"],["Frigideiras","Proprietario"],["Lixeira","Proprietario"],["Dispenser Esponja/Det.","Proprietario"],["Mesa de Jantar","Proprietario"],["Cadeiras","Proprietario"]] },
  "SALA": { icon: "🛋️", items: [["Sofá","Proprietario"],["Sofá Cama","Proprietario"],["Almofadas","Proprietario"],["TV","Proprietario"],["Cortina Blackout","Proprietario"]] },
  "QUARTO": { icon: "🛏️", items: [["Cama","Proprietario"],["Guarda-Roupa","Proprietario"],["TV","Proprietario"],["Cabides","Proprietario"],["Espelho Grande","Proprietario"],["Cortina Blackout","Proprietario"],["Almofadas","Proprietario"],["Travesseiros","Proprietario"]] },
  "BANHEIRO": { icon: "🚿", items: [["Lixeira","Proprietario"],["Dispenser Sabonete Líq.","Proprietario"],["Porta Escovas","Proprietario"],["Secador de Cabelo","Proprietario"],["Espelho","Proprietario"]] },
  "LIMPEZA": { icon: "🧹", items: [["Aspirador de Pó","Proprietario"],["Vassoura","Proprietario"],["Rodo","Proprietario"],["Balde","Proprietario"],["Pá de Lixo","Proprietario"]] },
  "COMODIDADES": { icon: "👔", items: [["Tábua de Passar Roupa","Proprietario"],["Ferro de Passar Roupa","Proprietario"]] },
  "ENXOVAL": { icon: "🛁", items: [["Capa Protetora Travesseiro","Proprietario"],["Capa Protetora Colchão","Proprietario"],["Edredom","Proprietario"],["Cobertor","Proprietario"],["Toalhas de Banho","Nomade"],["Toalhas de Rosto","Nomade"],["Tapete Banheiro","Nomade"],["Toalha Make Up","Nomade"],["Fronhas","Nomade"],["Lençol Elástico","Nomade"],["Lençol Cobrir","Nomade"],["Capa Edredom","Nomade"],["Tapete Entrada","Nomade"]] }
};

let DB = JSON.parse(localStorage.getItem('nomade_checklists') || '[]');
let currentId = null;

function save() { localStorage.setItem('nomade_checklists', JSON.stringify(DB)); }

function goHome() {
  showScreen('screen-home');
  renderHistory();
}

function goToForm() {
  document.getElementById('f-data').value = new Date().toISOString().split('T')[0];
  showScreen('screen-form');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  window.scrollTo(0,0);
}

function createChecklist() {
  const cond = document.getElementById('f-cond').value.trim();
  const apto = document.getElementById('f-apto').value.trim();
  if (!cond || !apto) { alert('Preencha condomínio e apto'); return; }

  const items = {};
  Object.entries(SECTIONS).forEach(([sec, {items: its}]) => {
    its.forEach(([nome, forn], i) => {
      items[`${sec}_${i}`] = { nome, forn, sim: null, qnt: '', obs: '' };
    });
  });

  const cl = {
    id: Date.now().toString(),
    cond, apto,
    hosp: document.getElementById('f-hosp').value || '',
    data: document.getElementById('f-data').value || '',
    porta: document.getElementById('f-porta').value || '',
    wifi: document.getElementById('f-wifi').value || '',
    items,
    createdAt: new Date().toISOString()
  };
  DB.unshift(cl);
  save();
  openChecklist(cl.id);
}

function openChecklist(id) {
  currentId = id;
  const cl = DB.find(c => c.id === id);
  if (!cl) return;
  document.getElementById('cl-title').textContent = cl.cond + ' — ' + cl.apto;
  const dataFmt = cl.data ? new Date(cl.data + 'T12:00:00').toLocaleDateString('pt-BR') : '';
  document.getElementById('cl-subtitle').textContent = dataFmt + (cl.hosp ? ` · ${cl.hosp} hóspedes` : '');
  renderChecklist(cl);
  showScreen('screen-checklist');
}

function renderChecklist(cl) {
  const body = document.getElementById('cl-body');
  const total = Object.keys(cl.items).length;
  const checked = Object.values(cl.items).filter(i => i.sim !== null).length;
  const pct = total ? Math.round(checked / total * 100) : 0;

  let html = `
    <div class="progress-block">
      <div class="progress-nums"><span>${checked} de ${total} itens</span><span>${pct}%</span></div>
      <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
    </div>`;

  Object.entries(SECTIONS).forEach(([sec, {icon, items: its}]) => {
    html += `<div class="cl-section"><div class="cl-section-title">${icon} ${sec}</div>`;
    its.forEach(([nome, forn], i) => {
      const key = `${sec}_${i}`;
      const item = cl.items[key];
      const ds = item.sim === true ? 'sim' : item.sim === false ? 'nao' : '';
      const fc = forn === 'Nomade' ? 'forn-nom' : 'forn-prop';
      const ft = forn === 'Nomade' ? 'Nômade' : 'Prop.';
      html += `
        <div class="cl-item">
          <div class="cl-item-top">
            <div class="status-dot ${ds}" id="dot_${key}">
              <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
              <svg class="cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </div>
            <span class="cl-item-name">${nome}</span>
            <span class="forn-tag ${fc}">${ft}</span>
          </div>
          <div class="cl-item-controls">
            <button class="toggle-sim ${item.sim===true?'active':''}" onclick="toggle('${key}',true)">Sim</button>
            <button class="toggle-nao ${item.sim===false?'active':''}" onclick="toggle('${key}',false)">Não</button>
            <input class="cl-input" placeholder="qtd / tipo" value="${item.qnt}" oninput="updateField('${key}','qnt',this.value)">
            <input class="cl-input" placeholder="obs." value="${item.obs}" oninput="updateField('${key}','obs',this.value)">
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  body.innerHTML = html;
}

function toggle(key, val) {
  const cl = DB.find(c => c.id === currentId);
  if (!cl) return;
  cl.items[key].sim = cl.items[key].sim === val ? null : val;
  save();

  const dot = document.getElementById('dot_' + key);
  const sv = cl.items[key].sim;
  dot.className = 'status-dot' + (sv === true ? ' sim' : sv === false ? ' nao' : '');

  const btn_sim = dot.parentElement.nextElementSibling?.previousElementSibling;
  const row = dot.closest('.cl-item');
  const controls = row.querySelector('.cl-item-controls');
  controls.querySelectorAll('.toggle-sim').forEach(b => b.classList.toggle('active', sv === true));
  controls.querySelectorAll('.toggle-nao').forEach(b => b.classList.toggle('active', sv === false));

  const total = Object.keys(cl.items).length;
  const checked = Object.values(cl.items).filter(i => i.sim !== null).length;
  const pct = Math.round(checked / total * 100);
  document.querySelector('.prog-bar-fill').style.width = pct + '%';
  document.querySelector('.progress-nums span:first-child').textContent = `${checked} de ${total} itens`;
  document.querySelector('.progress-nums span:last-child').textContent = pct + '%';
}

function updateField(key, field, value) {
  const cl = DB.find(c => c.id === currentId);
  if (!cl) return;
  cl.items[key][field] = value;
  save();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!DB.length) {
    el.innerHTML = `<div class="empty-state"><p>Nenhum checklist ainda.<br>Crie o primeiro!</p></div>`;
    return;
  }
  el.innerHTML = DB.map(cl => {
    const total = Object.keys(cl.items).length;
    const checked = Object.values(cl.items).filter(i => i.sim !== null).length;
    const pct = Math.round(checked / total * 100);
    const dataFmt = cl.data ? new Date(cl.data + 'T12:00:00').toLocaleDateString('pt-BR') : 'sem data';
    return `
      <div class="checklist-card" onclick="openChecklist('${cl.id}')">
        <div class="card-top">
          <span class="card-name">${cl.cond}</span>
          <span class="card-date">${dataFmt}</span>
        </div>
        <div class="card-sub">Apto ${cl.apto}${cl.hosp ? ' · ' + cl.hosp + ' hóspedes' : ''}</div>
        <div class="card-progress">
          <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
          <span class="mini-pct">${pct}%</span>
        </div>
        <div class="card-actions">
          <button class="card-del-btn" onclick="deleteChecklist(event,'${cl.id}')">🗑 Excluir</button>
        </div>
      </div>`;
  }).join('');
}

function deleteChecklist(e, id) {
  e.stopPropagation();
  if (!confirm('Excluir este checklist?')) return;
  DB = DB.filter(c => c.id !== id);
  save();
  renderHistory();
}

function sendWhatsApp() {
  const cl = DB.find(c => c.id === currentId);
  if (!cl) return;
  const dataFmt = cl.data ? new Date(cl.data + 'T12:00:00').toLocaleDateString('pt-BR') : '—';
  let msg = `*✅ CHECK-LIST IMPLANTAÇÃO — NÔMADE*\n\n`;
  msg += `📍 *Condomínio:* ${cl.cond}\n`;
  msg += `🏠 *Apto:* ${cl.apto}${cl.hosp ? ' · ' + cl.hosp + ' hóspedes' : ''}\n`;
  msg += `📅 *Data:* ${dataFmt}\n`;
  msg += `🔑 *Senha porta:* ${cl.porta || '—'}\n`;
  msg += `📶 *Wi-Fi:* ${cl.wifi || '—'}\n\n`;

  Object.entries(SECTIONS).forEach(([sec, {items: its}]) => {
    msg += `*${sec}*\n`;
    its.forEach(([nome], i) => {
      const key = `${sec}_${i}`;
      const item = cl.items[key];
      const status = item.sim === true ? '✅' : item.sim === false ? '❌' : '⬜';
      let line = `${status} ${nome}`;
      if (item.qnt) line += ` — ${item.qnt}`;
      if (item.obs) line += ` _(${item.obs})_`;
      msg += line + '\n';
    });
    msg += '\n';
  });

  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

// Init
renderHistory();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
